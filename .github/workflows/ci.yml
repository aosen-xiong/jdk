name: CI tests

on:
  schedule:
    - cron: '0 7 * * *' # Runs daily at 2:00 AM EST
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - master
      - codex/nullness-java-lang-*

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ !contains(github.ref, 'heads/master') }}

jobs:
  build_jdk:
    name: Build the JDK
    runs-on: ubuntu-22.04 # This JDK build requires the gcc-10/g++-10 packages.
    permissions:
      contents: read
    env:
      JAVA_VERSION: 17
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.0
        with:
          java-version: 17
          distribution: 'zulu'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade apt
          sudo apt-get install gcc-10 g++-10 libcups2-dev libasound2-dev libfontconfig1-dev \
              libx11-dev libxext-dev libxrender-dev libxrandr-dev libxtst-dev libxt-dev
      - name: Install jtreg
        run: |
          wget https://builds.shipilev.net/jtreg/jtreg-7.5%2B1.zip -O /tmp/jtreg.zip
          unzip /tmp/jtreg.zip -d /tmp/
      - name: Configure the JDK
        run: bash ./configure --with-jtreg=/tmp/jtreg --disable-warnings-as-errors
      - name: Build the JDK
        run: make jdk

  CF:
    name: ${{ matrix.script }} on JDK ${{ matrix.java_version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        script: ['cftests-junit', 'cftests-nonjunit']
        java_version: ['8', '11', '17', '21', '25', '27']
    env:
      JAVA_VERSION: ${{ matrix.java_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 for Gradle to run on
        uses: actions/setup-java@v6.0.0
        with:
          # Install JDK 21 first, to make it available to Gradle using `gradle.properties` below.
          java-version: '21'
          distribution: 'zulu'
      - name: Set up JDK ${{ matrix.java_version }}
        uses: actions/setup-java@v6.0.0
        with:
          java-version: ${{ matrix.java_version }}
          distribution: 'zulu'
      - name: Inject JAVA_HOME_21_64 into `gradle.properties` to always use JDK 21 for Gradle
        run: mkdir ~/.gradle && echo "org.gradle.java.home=$JAVA_HOME_21_X64" >> ~/.gradle/gradle.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
    
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        if: ${{ matrix.script == 'cftests-nonjunit' }}
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Clone plume-scripts
        run: mkdir -p /tmp/$USER && git -C /tmp/$USER clone --depth 1 -q https://github.com/eisop-plume-lib/plume-scripts.git

      - name: Clone git-scripts
        run: mkdir -p /tmp/$USER && git -C /tmp/$USER clone --depth 1 -q https://github.com/eisop-plume-lib/git-scripts.git

      - name: Clone checker-framework
        run: /tmp/$USER/git-scripts/git-clone-related eisop checker-framework

      - name: Run test script checker/bin-devel/test-${{ matrix.script }}.sh
        run: ./checker/bin-devel/test-${{ matrix.script }}.sh
        working-directory: ../checker-framework
        env:
          ORG_GRADLE_PROJECT_useJdkVersion: ${{ matrix.java_version }}

  extra:
    name: ${{ matrix.script }} on JDK ${{ matrix.java_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        script: ['plume-lib', 'daikon']
        java_version: ['21']
    env:
      JAVA_VERSION: ${{ matrix.java_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java_version }}
        uses: actions/setup-java@v6.0.0
        with:
          java-version: ${{ matrix.java_version }}
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Clone plume-scripts
        run: mkdir -p /tmp/$USER && git -C /tmp/$USER clone --depth 1 -q https://github.com/eisop-plume-lib/plume-scripts.git

      - name: Clone git-scripts
        run: mkdir -p /tmp/$USER && git -C /tmp/$USER clone --depth 1 -q https://github.com/eisop-plume-lib/git-scripts.git

      - name: Clone checker-framework
        run: /tmp/$USER/git-scripts/git-clone-related eisop checker-framework

      - name: Run test script checker/bin-devel/test-${{ matrix.script }}.sh
        run: ./checker/bin-devel/test-${{ matrix.script }}.sh
        working-directory: ../checker-framework

  Consistency:
    name: JDK consistency on JDK ${{ matrix.java_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        java_version: ['21']
    env:
      JAVA_VERSION: ${{ matrix.java_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java_version }}
        uses: actions/setup-java@v6.0.0
        with:
          java-version: ${{ matrix.java_version }}
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Clone plume-scripts
        run: mkdir -p /tmp/$USER && git -C /tmp/$USER clone --depth 1 -q https://github.com/eisop-plume-lib/plume-scripts.git

      - name: Clone git-scripts
        run: mkdir -p /tmp/$USER && git -C /tmp/$USER clone --depth 1 -q https://github.com/eisop-plume-lib/git-scripts.git

      - name: Clone checker-framework
        run: /tmp/$USER/git-scripts/git-clone-related eisop checker-framework

      - name: Run test script checker/bin-devel/check-jdk-consistency.sh
        run: ./checker/bin-devel/check-jdk-consistency.sh
        working-directory: ../checker-framework

  # Grow this explicit file list after each documentation review and passing source check.
  nullness:
    name: Nullness (java.lang)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: jdk
          persist-credentials: false
      - name: Check out Checker Framework
        uses: actions/checkout@v4
        with:
          repository: aosen-xiong/checker-framework
          ref: 3cf56232ad4b54ca96df50a689bf3c457ef9b7eb # codex/nullness-java-lang-loading-modules
          path: checker-framework
          persist-credentials: false
      - name: Check out the checker's bundled JDK contracts
        uses: actions/checkout@v4
        with:
          repository: eisop/jdk
          ref: 0af1a5ad1f994431fc6e08540000c4ae1ab13153
          path: bundled-jdk
          persist-credentials: false
      - name: Set up JDK 21 for the checker build
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '21.0.7'
      - name: Build Checker Framework
        working-directory: checker-framework
        run: |
          mkdir -p "$GITHUB_WORKSPACE/checker-framework/checker/build/jdk-typecheck"
          ./gradlew :checker:assembleForJavac --no-daemon --max-workers=2 \
            -x :framework:cloneAnnotatedJdk \
            -PannotatedJdkHome="$GITHUB_WORKSPACE/bundled-jdk" --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/checker-framework/checker/build/jdk-typecheck/checker-build.log"
          sha256sum checker/dist/checker.jar checker/dist/checker-qual.jar \
            > "$GITHUB_WORKSPACE/checker-framework/checker/build/jdk-typecheck/checker.sha256"
      - name: Set up JDK 17 for source checking
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '17.0.14+7'
      - name: Type-check the cumulative java.lang regression set
        working-directory: checker-framework
        env:
          JDK_SRC: ${{ github.workspace }}/jdk
        run: |
          checker/bin-devel/typecheck-jdk.sh nullness java.base \
            java/lang/StackTraceElement.java \
            java/lang/Throwable.java \
            java/lang/Exception.java \
            java/lang/RuntimeException.java \
            java/lang/Error.java \
            java/lang/ClassNotFoundException.java \
            java/lang/NullPointerException.java \
            java/lang/ExceptionInInitializerError.java \
            java/lang/ReflectiveOperationException.java \
            java/lang/LinkageError.java \
            java/lang/AssertionError.java \
            java/lang/TypeNotPresentException.java \
            java/lang/EnumConstantNotPresentException.java \
            java/lang/Appendable.java \
            java/lang/AutoCloseable.java \
            java/lang/CharSequence.java \
            java/lang/Cloneable.java \
            java/lang/Comparable.java \
            java/lang/Iterable.java \
            java/lang/Readable.java \
            java/lang/Runnable.java \
            java/lang/Object.java \
            java/lang/Enum.java \
            java/lang/Record.java \
            java/lang/Number.java \
            java/lang/Void.java \
            java/lang/Boolean.java \
            java/lang/Byte.java \
            java/lang/Short.java \
            java/lang/Integer.java \
            java/lang/Long.java \
            java/lang/Float.java \
            java/lang/Double.java \
            java/lang/Math.java \
            java/lang/StrictMath.java \
            java/lang/FdLibm.java \
            java/lang/String.java \
            java/lang/AbstractStringBuilder.java \
            java/lang/StringBuilder.java \
            java/lang/StringBuffer.java \
            java/lang/StringCoding.java \
            java/lang/StringConcatHelper.java \
            java/lang/StringLatin1.java \
            java/lang/StringUTF16.java \
            java/lang/Character.java \
            java/lang/CharacterData.java \
            java/lang/CharacterDataPrivateUse.java \
            java/lang/CharacterDataUndefined.java \
            java/lang/CharacterName.java \
            java/lang/ConditionalSpecialCasing.java \
            java/lang/ArithmeticException.java \
            java/lang/ArrayStoreException.java \
            java/lang/ClassCastException.java \
            java/lang/IllegalArgumentException.java \
            java/lang/IllegalCallerException.java \
            java/lang/IllegalMonitorStateException.java \
            java/lang/IllegalStateException.java \
            java/lang/IllegalThreadStateException.java \
            java/lang/LayerInstantiationException.java \
            java/lang/NegativeArraySizeException.java \
            java/lang/SecurityException.java \
            java/lang/UnsupportedOperationException.java \
            java/lang/NumberFormatException.java \
            java/lang/IndexOutOfBoundsException.java \
            java/lang/ArrayIndexOutOfBoundsException.java \
            java/lang/StringIndexOutOfBoundsException.java \
            java/lang/CloneNotSupportedException.java \
            java/lang/IllegalAccessException.java \
            java/lang/InstantiationException.java \
            java/lang/InterruptedException.java \
            java/lang/NoSuchFieldException.java \
            java/lang/NoSuchMethodException.java \
            java/lang/AbstractMethodError.java \
            java/lang/BootstrapMethodError.java \
            java/lang/ClassCircularityError.java \
            java/lang/ClassFormatError.java \
            java/lang/IllegalAccessError.java \
            java/lang/IncompatibleClassChangeError.java \
            java/lang/InstantiationError.java \
            java/lang/NoClassDefFoundError.java \
            java/lang/NoSuchFieldError.java \
            java/lang/NoSuchMethodError.java \
            java/lang/UnsatisfiedLinkError.java \
            java/lang/UnsupportedClassVersionError.java \
            java/lang/VerifyError.java \
            java/lang/VirtualMachineError.java \
            java/lang/InternalError.java \
            java/lang/OutOfMemoryError.java \
            java/lang/StackOverflowError.java \
            java/lang/UnknownError.java \
            java/lang/ThreadDeath.java \
            java/lang/Deprecated.java \
            java/lang/FunctionalInterface.java \
            java/lang/Override.java \
            java/lang/SafeVarargs.java \
            java/lang/SuppressWarnings.java \
            java/lang/Class.java \
            java/lang/ClassValue.java \
            java/lang/PublicMethods.java \
            java/lang/WeakPairMap.java \
            java/lang/ClassLoader.java \
            java/lang/AssertionStatusDirectives.java \
            java/lang/Package.java \
            java/lang/NamedPackage.java \
            java/lang/Module.java \
            java/lang/ModuleLayer.java
      - name: Check package-private helper callers from CF
        working-directory: checker-framework
        env:
          JDK_SRC: ${{ github.workspace }}/jdk
          JDK_EXTRA_SOURCE_ROOTS: ${{ github.workspace }}/checker-framework/checker/tests/jdk-source/java.base
        run: checker/bin-devel/typecheck-jdk.sh nullness java.base java/lang/TextHelperContracts.java java/lang/UnicodeHelperContracts.java java/lang/ReflectionHelperContracts.java java/lang/LoadingHelperContracts.java
      - name: Upload type-checking logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-lang-nullness-${{ github.run_id }}
          path: checker-framework/checker/build/jdk-typecheck/
          if-no-files-found: warn
