name: CI tests

on:
  schedule:
    - cron: '0 7 * * *' # Runs daily at 2:00 AM EST
  pull_request:
  push:
    branches: [ "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'heads/master') }}

jobs:
  build_jdk:
    name: Build the JDK
    runs-on: ubuntu-22.04 # This JDK build requires the gcc-10/g++-10 packages.
    permissions:
      contents: read
    env:
      JAVA_VERSION: 17
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.0
        with:
          java-version: 17
          distribution: 'zulu'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade apt
          sudo apt-get install gcc-10 g++-10 libcups2-dev libasound2-dev libfontconfig1-dev \
              libx11-dev libxext-dev libxrender-dev libxrandr-dev libxtst-dev libxt-dev
      - name: Install jtreg
        run: |
          wget https://builds.shipilev.net/jtreg/jtreg-7.5%2B1.zip -O /tmp/jtreg.zip
          unzip /tmp/jtreg.zip -d /tmp/
      - name: Configure the JDK
        run: bash ./configure --with-jtreg=/tmp/jtreg --disable-warnings-as-errors
      - name: Build the JDK
        run: make jdk

  CF:
    name: ${{ matrix.script }} on JDK ${{ matrix.java_version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        script: ['cftests-junit', 'cftests-nonjunit']
        java_version: ['8', '11', '17', '21', '25', '27']
    env:
      JAVA_VERSION: ${{ matrix.java_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 for Gradle to run on
        uses: actions/setup-java@v6.0.0
        with:
          # Install JDK 21 first, to make it available to Gradle using `gradle.properties` below.
          java-version: '21'
          distribution: 'zulu'
      - name: Set up JDK ${{ matrix.java_version }}
        uses: actions/setup-java@v6.0.0
        with:
          java-version: ${{ matrix.java_version }}
          distribution: 'zulu'
      - name: Inject JAVA_HOME_21_64 into `gradle.properties` to always use JDK 21 for Gradle
        run: mkdir ~/.gradle && echo "org.gradle.java.home=$JAVA_HOME_21_X64" >> ~/.gradle/gradle.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
    
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        if: ${{ matrix.script == 'cftests-nonjunit' }}
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Clone plume-scripts
        run: mkdir -p /tmp/$USER && git -C /tmp/$USER clone --depth 1 -q https://github.com/eisop-plume-lib/plume-scripts.git

      - name: Clone git-scripts
        run: mkdir -p /tmp/$USER && git -C /tmp/$USER clone --depth 1 -q https://github.com/eisop-plume-lib/git-scripts.git

      - name: Clone checker-framework
        run: /tmp/$USER/git-scripts/git-clone-related eisop checker-framework

      - name: Run test script checker/bin-devel/test-${{ matrix.script }}.sh
        run: ./checker/bin-devel/test-${{ matrix.script }}.sh
        working-directory: ../checker-framework
        env:
          ORG_GRADLE_PROJECT_useJdkVersion: ${{ matrix.java_version }}

  extra:
    name: ${{ matrix.script }} on JDK ${{ matrix.java_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        script: ['plume-lib', 'daikon']
        java_version: ['21']
    env:
      JAVA_VERSION: ${{ matrix.java_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java_version }}
        uses: actions/setup-java@v6.0.0
        with:
          java-version: ${{ matrix.java_version }}
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Clone plume-scripts
        run: mkdir -p /tmp/$USER && git -C /tmp/$USER clone --depth 1 -q https://github.com/eisop-plume-lib/plume-scripts.git

      - name: Clone git-scripts
        run: mkdir -p /tmp/$USER && git -C /tmp/$USER clone --depth 1 -q https://github.com/eisop-plume-lib/git-scripts.git

      - name: Clone checker-framework
        run: /tmp/$USER/git-scripts/git-clone-related eisop checker-framework

      - name: Run test script checker/bin-devel/test-${{ matrix.script }}.sh
        run: ./checker/bin-devel/test-${{ matrix.script }}.sh
        working-directory: ../checker-framework

  Consistency:
    name: JDK consistency on JDK ${{ matrix.java_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        java_version: ['21']
    env:
      JAVA_VERSION: ${{ matrix.java_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java_version }}
        uses: actions/setup-java@v6.0.0
        with:
          java-version: ${{ matrix.java_version }}
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Clone plume-scripts
        run: mkdir -p /tmp/$USER && git -C /tmp/$USER clone --depth 1 -q https://github.com/eisop-plume-lib/plume-scripts.git

      - name: Clone git-scripts
        run: mkdir -p /tmp/$USER && git -C /tmp/$USER clone --depth 1 -q https://github.com/eisop-plume-lib/git-scripts.git

      - name: Clone checker-framework
        run: /tmp/$USER/git-scripts/git-clone-related eisop checker-framework

      - name: Run test script checker/bin-devel/check-jdk-consistency.sh
        run: ./checker/bin-devel/check-jdk-consistency.sh
        working-directory: ../checker-framework

  # Grow this explicit file list after each documentation review and passing source check.
  nullness:
    name: Nullness (java.lang)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: jdk
          persist-credentials: false
      - name: Check out Checker Framework
        uses: actions/checkout@v4
        with:
          repository: aosen-xiong/checker-framework
          ref: 74a722487d041305f25d36662ec001fa311f638f # codex/nullness-java-lang
          path: checker-framework
          persist-credentials: false
      - name: Check out the checker's bundled JDK contracts
        uses: actions/checkout@v4
        with:
          repository: eisop/jdk
          ref: 0af1a5ad1f994431fc6e08540000c4ae1ab13153
          path: bundled-jdk
          persist-credentials: false
      - name: Set up JDK 21 for the checker build
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '21.0.7'
      - name: Build Checker Framework
        working-directory: checker-framework
        run: |
          mkdir -p "$GITHUB_WORKSPACE/checker-framework/checker/build/jdk-typecheck"
          ./gradlew :checker:assembleForJavac --no-daemon --max-workers=2 \
            -x :framework:cloneAnnotatedJdk \
            -PannotatedJdkHome="$GITHUB_WORKSPACE/bundled-jdk" --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/checker-framework/checker/build/jdk-typecheck/checker-build.log"
          sha256sum checker/dist/checker.jar checker/dist/checker-qual.jar \
            > "$GITHUB_WORKSPACE/checker-framework/checker/build/jdk-typecheck/checker.sha256"
      - name: Set up JDK 17 for source checking
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '17.0.14+7'
      - name: Type-check the java.lang exceptions batch
        working-directory: checker-framework
        env:
          JDK_SRC: ${{ github.workspace }}/jdk
        run: |
          checker/bin-devel/typecheck-jdk.sh nullness java.base \
            java/lang/StackTraceElement.java \
            java/lang/Throwable.java \
            java/lang/Exception.java \
            java/lang/RuntimeException.java \
            java/lang/Error.java
      - name: Upload type-checking logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-lang-nullness-${{ github.run_id }}
          path: checker-framework/checker/build/jdk-typecheck/
          if-no-files-found: warn
