name: Namespace nullness

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: namespace-nullness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  namespace-nullness:
    name: Namespace nullness (JSpecify)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: jdk
          persist-credentials: false

      - name: Check out the pinned checker
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: eisop/checker-framework
          ref: c12ce38daa5a3978ac3fce693c8f870ebecbd09b
          path: checker-framework
          persist-credentials: false

      - name: Check out the pinned bundled JDK contracts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: eisop/jdk
          ref: 0af1a5ad1f994431fc6e08540000c4ae1ab13153
          path: bundled-jdk
          persist-credentials: false

      - name: Set up Java 17 for source checking
        id: check-java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17.0.14+7

      - name: Set up Java 21 for the checker build
        id: build-java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21.0.7+6
          cache: gradle
          cache-dependency-path: |
            checker-framework/gradle/libs.versions.toml
            checker-framework/gradle/wrapper/gradle-wrapper.properties
            checker-framework/**/*.gradle

      - name: Build the pinned checker and record its artifacts
        run: >-
          python3 jdk/ci/nullness/bootstrap.py
          --checker-root "$GITHUB_WORKSPACE/checker-framework"
          --bundled-jdk-root "$GITHUB_WORKSPACE/bundled-jdk"
          --build-java-home "${{ steps.build-java.outputs.path }}"
          --check-java-home "${{ steps.check-java.outputs.path }}"

      - name: Test result classification and coverage guards
        working-directory: jdk
        run: python3 -m unittest discover -s ci/nullness -p 'test_*.py'

      - name: Verify checker execution and mode assumptions
        working-directory: jdk
        run: python3 ci/nullness/run.py preflight --label preflight

      - name: Check all enrolled namespace files
        working-directory: jdk
        run: python3 ci/nullness/run.py check --label namespace

      - name: Check documented callers and implementation contracts
        working-directory: jdk
        run: python3 ci/nullness/namespace_contracts.py --label contracts

      - name: Audit suppressions
        working-directory: jdk
        run: python3 ci/nullness/run.py check --audit-suppressions --label suppression-audit

      - name: Preserve commands, sources, logs and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: namespace-nullness-${{ github.run_id }}-${{ github.run_attempt }}
          path: jdk/.nullness-ci/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
